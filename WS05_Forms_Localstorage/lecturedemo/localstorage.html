     <!-- Buttons for saving and loading data -->

      <button type="button" id="haeBtn">Hae / Load</button>
   
    <!-- Tallennettu tieto tai palaute näytetään tässä. -->
    <!-- Display the saved data or feedback here. -->
     <p id="tulos"></p>

    <!-- localStorage.removeItem("tervehdys"); OR localStorage.clear(); If you want to clear and remove the local storage data, you can do it from the browser's developer tools. In Chrome, for example, you can open the developer tools (F12), go to the "Application" tab, and under "Storage" select "Local Storage". There you can see the saved data and delete it if needed. -->
